<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Loyalty Card</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { 
      background: #0f172a; 
      color: #f8fafc; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    .stamp-glow { 
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); 
    }
  </style>
</head>

<!-- Body container for dynamic background color -->
<body id="main-bg" class="min-h-screen flex items-center justify-center p-4 transition-colors duration-500">

  <!-- Main Card Box for dynamic card color -->
  <div id="card-box" class="max-w-md w-full bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-6 text-center relative overflow-hidden transition-colors duration-500">
    
    <!-- HEADER -->
    <div class="mb-6 flex flex-col items-center">
      <!-- Logo Container -->
      <div id="logo-container" class="mb-3 flex items-center justify-center min-h-[50px]">
        <span id="default-logo" class="text-4xl">☕</span>
      </div>
      <h1 id="biz-name" class="text-2xl font-bold text-amber-400">Loading Business...</h1>
      <p id="status-box" class="text-xs text-slate-400 mt-1">Fetching reward info...</p>
    </div>

    <!-- LOYALTY CARD DISPLAY -->
    <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-700/50 mb-6">
      <div class="flex justify-between items-center mb-4">
        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Loyalty Pass</span>
        <span id="stamp-count" class="text-xs font-bold text-amber-400">0 / 0 STAMPS</span>
      </div>

      <!-- Stamp Grid Container -->
      <div id="stamp-grid" class="grid grid-cols-5 gap-2 my-4"></div>
    </div>

    <!-- FOOTER -->
    <div class="text-xs text-slate-500 uppercase tracking-widest font-semibold">
      Powered by Smart Loyalty
    </div>

  </div>

  <script>
    // 1. Initialize Supabase Client
    const SUPABASE_URL = "https://putgidywotlxvnemsgln.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_Hy4uQw5cAhss-YdiSEbMIw_weDFiZeK";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. Extract Business ID & NFC Stamp Trigger from URL
    const urlParams = new URLSearchParams(window.location.search);
    const bizId = urlParams.get('biz') || 'smiths_cafe';
    const isNfcTap = urlParams.get('stamp') === 'true'; 

    // 3. Persistent Device ID for Local Storage Tracking
    let deviceId = localStorage.getItem('loyalty_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('loyalty_device_id', deviceId);
    }

    let currentBiz = null;

    // 4. Main App Initialization
    async function initApp() {
      try {
        // Fetch Business Info from Supabase
        const { data: bizList, error: bizError } = await db
          .from('businesses')
          .select('*')
          .eq('id', bizId);

        if (bizError || !bizList || bizList.length === 0) {
          console.error("Biz Fetch Error:", bizError);
          document.getElementById('biz-name').innerText = "Business Not Found";
          document.getElementById('status-box').innerText = "Please check your NFC tag link or database entry.";
          return;
        }

        const biz = bizList[0];
        currentBiz = biz;
        document.getElementById('biz-name').innerText = biz.name;
        document.getElementById('status-box').innerText = biz.reward_description || "Collect stamps for rewards!";

        // 🖼️ RENDER CUSTOM LOGO IF AVAILABLE
        if (currentBiz.logo_url && currentBiz.logo_url.trim() !== '') {
          const logoContainer = document.getElementById('logo-container');
          logoContainer.innerHTML = `<img src="${currentBiz.logo_url}" alt="Logo" class="h-16 w-auto max-w-[160px] object-contain rounded-lg">`;
        }

        // 🎨 APPLY DYNAMIC STYLING
        if (currentBiz.bg_color) {
          document.getElementById('main-bg').style.backgroundColor = currentBiz.bg_color;
        }
        if (currentBiz.card_bg) {
          document.getElementById('card-box').style.backgroundColor = currentBiz.card_bg;
        }
        if (currentBiz.accent_color) {
          document.getElementById('biz-name').style.color = currentBiz.accent_color;
          document.getElementById('stamp-count').style.color = currentBiz.accent_color;
        }

        // Fetch user's current loyalty pass
        let { data: pass, error: passError } = await db
          .from('passes')
          .select('*')
          .eq('business_id', bizId)
          .eq('device_id', deviceId)
          .maybeSingle();

        let currentCount = pass ? pass.stamp_count : 0;
        const totalRequired = biz.total_stamps_required || 10;
        const cooldownMinutes = biz.cooldown_minutes || 0;

        // 5. NFC STAMPING WITH COOLDOWN PROTECTION
        if (isNfcTap) {
          let canStamp = true;
          let minutesLeft = 0;

          if (pass && pass.updated_at && cooldownMinutes > 0) {
            const lastStampTime = new Date(pass.updated_at).getTime();
            const now = new Date().getTime();
            const elapsedMinutes = (now - lastStampTime) / (1000 * 60);

            if (elapsedMinutes < cooldownMinutes) {
              canStamp = false;
              minutesLeft = Math.ceil(cooldownMinutes - elapsedMinutes);
            }
          }

          if (canStamp) {
            currentCount = Math.min(currentCount + 1, totalRequired);

            if (!pass) {
              await db.from('passes').insert([{
                business_id: bizId,
                device_id: deviceId,
                stamp_count: currentCount,
                updated_at: new Date()
              }]);
            } else {
              await db.from('passes').update({
                stamp_count: currentCount,
                updated_at: new Date()
              }).eq('id', pass.id);
            }

            document.getElementById('status-box').innerText = "🎉 Stamp added successfully!";
          } else {
            document.getElementById('status-box').innerText = `⏳ Please wait ${minutesLeft} min before your next stamp!`;
          }

          // Clean up URL parameter
          const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?biz=${bizId}`;
          window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        }

        // Render stamps on card
        document.getElementById('stamp-count').innerText = `${currentCount} / ${totalRequired} STAMPS`;
        renderStamps(currentCount, totalRequired);

      } catch (err) {
        console.error("App Crash Error:", err);
      }
    }

    // Helper function to render stamp icons
    function renderStamps(currentCount, totalRequired) {
      const grid = document.getElementById('stamp-grid');
      if (!grid) return;
      grid.innerHTML = '';

      for (let i = 0; i < totalRequired; i++) {
        const stamp = document.createElement('div');
        const isStamped = i < currentCount;

        stamp.className = `aspect-square rounded-xl flex items-center justify-center text-lg border transition-all ${
          isStamped 
            ? 'bg-amber-500/20 border-amber-400 text-amber-400 stamp-glow scale-105' 
            : 'bg-black/30 border-white/10 text-white/20'
        }`;

        stamp.innerText = isStamped ? '☕' : '◯';
        grid.appendChild(stamp);
      }
    }

    // Run app on load
    initApp();
  </script>
</body>
</html>
