<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Loyalty Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- MAIN LOYALTY CARD CONTAINER -->
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 text-center">
    
    <!-- HEADER -->
    <div class="space-y-2">
      <div class="w-16 h-16 bg-slate-800 border border-slate-700 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
        ☕
      </div>
      <h1 id="biz-name" class="text-xl font-extrabold text-amber-400 tracking-wide">smiths coffee shop</h1>
      <span class="inline-block px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full text-xs font-semibold uppercase tracking-wider">
        🏅 Bronze Member
      </span>
      <p id="customer-name-display" class="text-sm font-semibold text-slate-300">Loading...</p>
      <p id="reward-display" class="text-xs text-slate-400">free coffee</p>
      
      <!-- LIVE ANTI-SCREENSHOT CLOCK -->
      <div class="pt-1">
        <span id="live-clock" class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full text-[11px] font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          🟢 LIVE: --:--:--
        </span>
      </div>
    </div>

    <!-- STATUS & COOLDOWN BOX -->
    <div id="status-box" class="py-2 px-4 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700/50">
      ⏳ Processing pass status...
    </div>

    <!-- STAMPS CONTAINER -->
    <div class="bg-slate-950/60 p-5 rounded-2xl border border-slate-800 space-y-4">
      <div class="flex justify-between items-center text-xs font-bold text-slate-400">
        <span>STANDARD LOYALTY PASS</span>
        <span id="stamp-ratio-text" class="text-amber-400 font-mono">0 / 10 STAMPS</span>
      </div>

      <!-- 10 STAMP GRID -->
      <div id="stamp-grid" class="grid grid-cols-5 gap-3 py-2">
        <!-- Rendered dynamically -->
      </div>

      <div class="flex justify-between items-center text-[11px] text-slate-500 pt-2 border-t border-slate-800/80">
        <span>Lifetime Visits:</span>
        <span id="lifetime-stamps-text" class="font-bold text-slate-300">0 Stamps</span>
      </div>
    </div>

    <p class="text-[10px] text-slate-600 font-medium uppercase tracking-widest">POWERED BY SMART LOYALTY</p>
  </div>

<script>
  const SUPABASE_URL = "https://putgidywotlxvnemsgln.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Hy4uQw5cAhss-YdiSEbMIw_weDFiZeK";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // START LIVE DIGITAL CLOCK
  function startLiveClock() {
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('en-US', { hour12: true });
      document.getElementById('live-clock').innerHTML = `🟢 LIVE: ${timeString}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  }
  startLiveClock();

  // Read params or set defaults
  const urlParams = new URLSearchParams(window.location.search);
  const bizId = urlParams.get('biz') || 'smiths_cafe';
  let deviceId = urlParams.get('device');

  if (!deviceId) {
    deviceId = localStorage.getItem('loyalty_device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.floor(Math.random() * 100000000);
      localStorage.setItem('loyalty_device_id', deviceId);
    }
  }

  async function initPass() {
    // 1. Fetch Business Profile
    const { data: biz } = await db.from('businesses').select('*').eq('id', bizId).maybeSingle();
    const bizName = biz?.name || 'smiths coffee shop';
    const totalRequired = biz?.total_stamps_required || 10;
    const cooldownMinutes = Number(biz?.cooldown_minutes) || 0;

    document.getElementById('biz-name').innerText = bizName;

    // 2. Fetch Existing Pass
    let { data: pass } = await db.from('passes')
      .select('*')
      .eq('business_id', bizId)
      .eq('device_id', deviceId)
      .maybeSingle();

    let currentCount = pass ? pass.stamp_count : 0;
    let lifetimeCount = pass ? (pass.total_lifetime_stamps || pass.stamp_count || 0) : 0;
    let customerName = pass?.customer_name || 'james';

    let canStamp = true;
    let minutesLeft = 0;

    // 3. Cooldown Verification for existing passes
    if (pass && pass.updated_at && cooldownMinutes > 0) {
      const lastStampTime = new Date(pass.updated_at).getTime();
      const elapsedMinutes = (new Date().getTime() - lastStampTime) / (1000 * 60);

      if (elapsedMinutes < cooldownMinutes) {
        canStamp = false;
        minutesLeft = Math.ceil(cooldownMinutes - elapsedMinutes);
      }
    }

    // 4. Stamping Logic Execution
    if (canStamp) {
      currentCount = Math.min(currentCount + 1, totalRequired);
      lifetimeCount += 1;

      const { error: saveError } = await db.from('passes').upsert({
        business_id: bizId,
        device_id: deviceId,
        customer_name: customerName,
        stamp_count: currentCount,
        total_lifetime_stamps: lifetimeCount,
        updated_at: new Date().toISOString()
      }, { onConflict: 'business_id, device_id' });

      if (saveError) {
        console.error("Save Error:", saveError);
        document.getElementById('status-box').innerHTML = "⚠️ Error saving stamp!";
      } else {
        document.getElementById('status-box').innerHTML = "🎉 Stamp added successfully!";
      }
    } else {
      document.getElementById('status-box').innerHTML = `⏳ Please wait <b>${minutesLeft} min</b> before your next stamp!`;
    }

    // 5. Render Pass Interface
    renderUI(customerName, currentCount, lifetimeCount, totalRequired);
  }

  function renderUI(name, current, lifetime, total) {
    document.getElementById('customer-name-display').innerText = name;
    document.getElementById('stamp-ratio-text').innerText = `${current} / ${total} STAMPS`;
    document.getElementById('lifetime-stamps-text').innerText = `${lifetime} Stamps`;

    const grid = document.getElementById('stamp-grid');
    grid.innerHTML = '';

    for (let i = 1; i <= total; i++) {
      const isStamped = i <= current;
      const stampEl = document.createElement('div');
      stampEl.className = `w-10 h-10 rounded-full flex items-center justify-center border transition-all ${
        isStamped 
          ? 'bg-amber-500 border-amber-400 text-slate-950 font-bold shadow-lg shadow-amber-500/30' 
          : 'bg-slate-900 border-slate-800 text-slate-700'
      }`;
      stampEl.innerHTML = isStamped ? '☕' : '◯';
      grid.appendChild(stampEl);
    }
  }

  initPass();
</script>
</body>
</html>
